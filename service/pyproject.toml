[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kothalipi-service"
version = "1.4.0"
description = "D-Bus service providing speech-to-text and read aloud for the Kothalipi GNOME Shell extension"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Kaveh Tehrani", email = "codemonkey13x@gmail.com"}
]
maintainers = [
    {name = "Mohiuddin"}
]
keywords = [
    "gnome",
    "speech-to-text",
    "text-to-speech",
    "dbus",
    "voice-recognition",
    "accessibility"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "dbus-next>=0.2.3",
    "openai-whisper>=20231117",
    "torch>=1.13.0",
    "torchaudio>=0.13.0",
]

[project.optional-dependencies]
# Read aloud. It also needs the Kokoro model files, which the installer fetches.
read-aloud = [
    "kokoro-onnx>=0.6.1; python_version >= '3.10'",
]
dev = [
    "build",
    "twine",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/mohiuddin200/kothalipi"
Repository = "https://github.com/mohiuddin200/kothalipi"
Issues = "https://github.com/mohiuddin200/kothalipi/issues"
Documentation = "https://github.com/mohiuddin200/kothalipi/blob/main/README.md"

[project.scripts]
kothalipi-service = "kothalipi_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kothalipi_service = ["../data/*"]
